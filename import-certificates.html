<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Chứng Chỉ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-primary: #050b12;
      --bg-secondary: #0a1525;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent-cyan: #00f5d4;
      --accent-blue: #0ea5e9;
      --border: rgba(0, 245, 212, 0.15);
      --radius: 16px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: radial-gradient(circle at top, rgba(0, 245, 212, 0.05), transparent 35%), var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: var(--accent-cyan);
    }

    .header p {
      color: var(--text-secondary);
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .cert-list {
      display: grid;
      gap: 12px;
    }

    .cert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 245, 212, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cert-item:hover {
      background: rgba(0, 245, 212, 0.1);
      border-color: var(--accent-cyan);
    }

    .cert-item input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .cert-item-text {
      flex-grow: 1;
    }

    .cert-item-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .cert-item-issuer {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent-cyan);
    }

    .btn-secondary:hover {
      background: rgba(0, 245, 212, 0.1);
    }

    .status {
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .status-icon {
      margin-right: 8px;
    }

    .note {
      padding: 16px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      color: #3b82f6;
      margin-bottom: 24px;
    }

    .note-title {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .select-all {
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent-cyan);
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      margin-bottom: 16px;
      width: 100%;
    }

    .select-all:hover {
      background: rgba(0, 245, 212, 0.1);
      border-color: var(--accent-cyan);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-blue);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

<div class="container">
  <a href="my-certificates.html" class="back-link">
    <i class="fas fa-arrow-left"></i>
    Quay lại danh sách
  </a>

  <div class="header">
    <h1>Import Chứng Chỉ</h1>
    <p>Thêm các chứng chỉ Google AI Essentials vào hệ thống</p>
  </div>

  <div class="note">
    <div class="note-title">ℹ️ Lưu ý</div>
    <div>Chứng chỉ sẽ được tạo mà không có hình ảnh. Vào trang <a href="certificates.html" style="color: #3b82f6; text-decoration: underline;">Lưu trữ chứng chỉ</a> để upload ảnh cho chúng.</div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-list"></i>
      Chứng Chỉ Google AI Essentials
    </h2>
    <button class="select-all" onclick="toggleSelectAll()">
      <i class="fas fa-check-square"></i> Chọn tất cả
    </button>
    <div class="cert-list" id="cert-list"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="importSelected()">
        <i class="fas fa-download"></i> Import Chứng Chỉ
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">Bỏ chọn</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card" style="text-align: center; color: var(--text-secondary);">
    <p>✅ Tạo xong? Chuyển đến <a href="my-certificates.html" style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Xem chứng chỉ của tôi</a></p>
  </div>
</div>

<script>
const certificates = [
  {
    title: "Google AI Essentials",
    issuer: "Google",
    date: "2026-08"
  },
  {
    title: "Introduction to AI",
    issuer: "Google",
    date: "2026-08"
  },
  {
    title: "Discover the Art of Prompting",
    issuer: "Google",
    date: "2026-08"
  },
  {
    title: "Maximize Productivity With AI Tools",
    issuer: "Google",
    date: "2026-08"
  },
  {
    title: "Stay Ahead of the AI Curve",
    issuer: "Google",
    date: "2026-08"
  },
  {
    title: "Use AI Responsibly",
    issuer: "Google",
    date: "2026-08"
  }
];

const DB_NAME = 'certificateArchiveDB';
const STORE_NAME = 'certificates';

function renderCertList() {
  const list = document.getElementById('cert-list');
  list.innerHTML = certificates.map((cert, idx) => `
    <label class="cert-item">
      <input type="checkbox" class="cert-checkbox" value="${idx}" checked>
      <div class="cert-item-text">
        <div class="cert-item-title">${cert.title}</div>
        <div class="cert-item-issuer">📚 ${cert.issuer} • ${cert.date}</div>
      </div>
      <i class="fas fa-check" style="color: var(--accent-cyan); display: none;"></i>
    </label>
  `).join('');
}

function toggleSelectAll() {
  const checkboxes = document.querySelectorAll('.cert-checkbox');
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
}

function clearAll() {
  document.querySelectorAll('.cert-checkbox').forEach(cb => cb.checked = false);
}

async function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = event => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => resolve(request.target.result);
    request.onerror = () => reject(request.target.error);
  });
}

async function saveCertificate(certificate) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const request = store.put(certificate);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.target.error);
  });
}

async function importSelected() {
  const checkboxes = document.querySelectorAll('.cert-checkbox:checked');
  const selected = Array.from(checkboxes).map(cb => parseInt(cb.value));

  if (selected.length === 0) {
    showStatus('Vui lòng chọn ít nhất một chứng chỉ', 'error');
    return;
  }

  try {
    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin status-icon"></i>Đang import...';
    statusDiv.classList.add('show');

    for (const idx of selected) {
      const cert = certificates[idx];
      await saveCertificate({
        id: `cert-${Date.now()}-${idx}`,
        title: cert.title,
        issuer: cert.issuer,
        date: cert.date,
        images: [],
        savedAt: Date.now()
      });
      await new Promise(resolve => setTimeout(resolve, 100));
    }

    showStatus(`✅ Đã import thành công ${selected.length} chứng chỉ!`, 'success');
    setTimeout(() => {
      window.location.href = 'my-certificates.html';
    }, 1500);
  } catch (error) {
    showStatus(`❌ Lỗi: ${error.message}`, 'error');
  }
}

function showStatus(message, type) {
  const statusDiv = document.getElementById('status');
  statusDiv.innerHTML = message;
  statusDiv.className = `status show ${type}`;
}

document.addEventListener('DOMContentLoaded', renderCertList);
</script>

</body>
</html>
